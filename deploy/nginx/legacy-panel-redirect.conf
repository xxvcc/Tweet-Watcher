# Only the old landing page redirects. Old API/assets never proxy the panel.
location = /a {
    add_header Set-Cookie "tw_sess=; Path=/; Max-Age=0; Secure; HttpOnly; SameSite=Lax" always;
    add_header Set-Cookie "tw_csrf=; Path=/; Max-Age=0; Secure; SameSite=Lax" always;
    return 302 https://tweet.lanny.me/;
}
location = /a/ {
    add_header Set-Cookie "tw_sess=; Path=/; Max-Age=0; Secure; HttpOnly; SameSite=Lax" always;
    add_header Set-Cookie "tw_csrf=; Path=/; Max-Age=0; Secure; SameSite=Lax" always;
    return 302 https://tweet.lanny.me/;
}
location ^~ /a/ { return 410; }
