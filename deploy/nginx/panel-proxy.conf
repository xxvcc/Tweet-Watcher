# Include within the BaoTa-managed tweet.lanny.me server block.
# Keep its certificate paths, renewal configuration and well-known include.
include /etc/tweet-watcher/cloudflare-realip.conf;
# The existing http-level map checks Cloudflare/loopback using $realip_remote_addr.
if ($openclaw_origin_block = 1) { return 403; }
client_max_body_size 256k;

location ^~ /.well-known/acme-challenge/ {
    root /www/wwwroot/tweet.lanny.me;
    default_type text/plain;
    try_files $uri =404;
}
location ^~ / {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host tweet.lanny.me;
    # Replace client input with the visitor address verified by realip.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    include /etc/tweet-watcher/proxy-token-nginx.conf;
    proxy_set_header Connection "";
    proxy_request_buffering on;
    proxy_buffering off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 3600s;
    # Security headers come from Node; don't add duplicate CSP/frame policies.
}
